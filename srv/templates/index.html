<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini-kanban</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>mini-kanban</h1>
            <div class="project-selector">
                <label for="project">Project:</label>
                <select id="project" name="project" 
                    hx-get="/partials/list" 
                    hx-trigger="change"
                    hx-target="#task-list"
                    hx-swap="innerHTML"
                    hx-include="[name='q'], [name='done']">
                    {{range .Projects}}
                    <option value="{{.Name}}" {{if eq .Name $.CurrentProject}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>
        </header>

        <main>
            <!-- Add Task Form -->
            <form class="add-form" hx-post="/tasks" hx-swap="none" hx-on::after-request="this.reset()">
                <input type="hidden" name="project" value="{{.CurrentProject}}">
                <div class="form-row">
                    <input type="text" name="title" placeholder="New task..." required class="input-title">
                    <input type="text" name="tags" placeholder="Tags (comma separated)" class="input-tags">
                    <input type="date" name="due" class="input-due">
                    <button type="submit" class="btn-add">Add</button>
                </div>
            </form>

            <!-- Search and Filter -->
            <div class="search-bar">
                <input type="text" name="q" placeholder="Search tasks..." value="{{.Query}}"
                    hx-get="/partials/list"
                    hx-trigger="keyup changed delay:300ms"
                    hx-target="#task-list"
                    hx-swap="innerHTML"
                    hx-include="[name='project'], [name='done']">
                <label class="toggle-done">
                    <input type="checkbox" name="done" value="1" {{if .ShowDone}}checked{{end}}
                        hx-get="/partials/list"
                        hx-trigger="change"
                        hx-target="#task-list"
                        hx-swap="innerHTML"
                        hx-include="[name='project'], [name='q']">
                    Show completed
                </label>
            </div>

            <!-- Task List -->
            <div id="task-list" 
                hx-get="/partials/list?project={{.CurrentProject}}"
                hx-trigger="taskCreated from:body, taskUpdated from:body, taskDeleted from:body">
                {{template "task_list.html" .}}
            </div>
        </main>

        <footer>
            <p>mini-kanban • Lightweight task management</p>
        </footer>
    </div>
</body>
</html>
