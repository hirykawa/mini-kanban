<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{call .T "web.page.title"}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    <div class="container kanban-container">
        <header>
            <h1>{{call .T "web.page.title"}}</h1>
            <div class="project-selector">
                <label for="project">{{call .T "web.project"}}</label>
                <select id="project" name="project" 
                    hx-get="/partials/kanban" 
                    hx-trigger="change"
                    hx-target="#kanban-board"
                    hx-swap="innerHTML">
                    {{range .Projects}}
                    <option value="{{.Name}}" {{if eq .Name $.CurrentProject}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>
        </header>

        <main>
            <!-- Add Task Form -->
            <form class="add-form" hx-post="/tasks" hx-swap="none" hx-on::after-request="this.reset()">
                <input type="hidden" name="project" value="{{.CurrentProject}}">
                <div class="form-row">
                    <input type="text" name="title" placeholder="{{call .T "web.add.title"}}" required class="input-title">
                    <input type="text" name="tags" placeholder="{{call .T "web.add.tags"}}" class="input-tags">
                    <select name="due" class="input-due">
                        <option value="">{{call .T "web.due.none"}}</option>
                        {{range .DuePresets}}
                        <option value="{{.Value}}" {{if eq .Label (call $.T "web.due.today")}}selected{{end}}>{{.Label}}</option>
                        {{end}}
                    </select>
                    <button type="submit" class="btn-add">{{call .T "web.add.btn"}}</button>
                </div>
            </form>

            <!-- Kanban Board -->
            <div id="kanban-board" class="kanban-board"
                hx-get="/partials/kanban?project={{.CurrentProject}}"
                hx-trigger="taskCreated from:body, taskUpdated from:body, taskDeleted from:body">
                {{template "kanban.html" .}}
            </div>
        </main>

        <footer>
            <p>{{call .T "web.footer"}}</p>
        </footer>
    </div>
    <script src="/static/kanban.js"></script>
</body>
</html>
